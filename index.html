<header class="top"><div class="wrap"><span class="brand"><i aria-hidden="true"></i>配色圖鑑</span><a id="source-link" href="#sources">配色參考</a></div></header>
<main class="wrap">
<section class="hero"><div><h1>配色圖鑑</h1><p>為簡報、學習單和網頁挑一組好用的色票。</p></div><div class="hero-art" aria-hidden="true"><i style="background:#07405B"></i><i style="background:#DFCAB5"></i><i style="background:#560F2D"></i><i style="background:#1F4E2A"></i></div></section>

<div class="grid" id="grid"></div>
<details class="sources" id="sources"><summary>配色分類與參考資料</summary><p>色票依下列網站的分類概念與風格編排。每組依順序顯示 2–8 色，前 4 色是預設搭配，後 4 色供延伸使用。</p><ul>
<li>色輪搭配（同色系、鄰近色、互補色、三色配色） <a href="https://helpx.adobe.com/content/dam/help/en/pdf/after_effects_reference.pdf" target="_blank" rel="noopener">Adobe 色彩搭配規則</a></li>
<li>風格靈感（粉彩、復古） <a href="https://colorhunt.co/palettes/vintage-pastel" target="_blank" rel="noopener">Color Hunt</a></li>
<li>圖表配色（漸進、發散、類別） <a href="https://colorbrewer2.org/learnmore/schemes.html" target="_blank" rel="noopener">ColorBrewer</a></li>
</ul></details>
</main>
<dialog id="preview-dialog" class="preview-dialog" aria-labelledby="preview-title">

<script>

['夜空與冰川','冷色','同色系・藍','163D65 3676A5 7CB6DB D4EAF8 102945 5191C0 A4D0EA EFF7FD'],
['灰綠茶席','柔霧','茶色・中性','54655A 889E8C C6D0C4 E8E4D9 9B8271 3C4A40 ADAE9B F7F3EA'],
['杏桃與風鈴','粉彩','橙藍紫・柔和','F4BE97 C6D9F5 D9C8EF F6E5AE A7CAC7 FDEBDF 7F739D B58C75'],
['學習進度','圖表','漸進・淺到深','EEF7F2 D3EADD A9D4BD 78B89A 539578 36775C 205A42 103E2D'],
['觀點差異','圖表','發散・雙向','A84D2E F2C2A1 C1DCEB 2E6694 77341F D78356 72A9C9 183D62'],
['活動分組','圖表','類別・區別','376293 CC763A 237A68 9B547E B38823 7062A5 B95552 58636D'],
['石墨與紙','中性','黑白灰・單色系','202524 696F6C B6BAB4 E9EAE4 3D4440 909891 D1D6CE FAFAF6']
].map(([name, category, tags, codes], id) => ({id,name,category,tags,colors:codes.split(' ').map(hex=>'#'+hex)}));
const byId = id => document.getElementById(id);
const grid = byId('grid');
const tabs = byId('tabs');
const search = byId('search');
const selected = new Set();
const counts = new Map();
const categories = ['全部','暖色','冷色','自然','柔霧','粉彩','復古','中性','圖表'];
let category = '全部';
let toastTimer;
const cardColors = id => palettes[id].colors.slice(0, counts.get(id) ?? 4);
tabs.innerHTML = categories.map(label => `<button data-category="${label}" aria-pressed="${label === category}">${label}</button>`).join('');
function card(p) {
  const colors = cardColors(p.id);
  const size = colors.length;
  const active = selected.has(p.id);
  return `<article class="card ${active ? 'selected' : ''}" data-id="${p.id}">
    <header><h3>${p.name}</h3><span class="muted">${p.category}</span></header>
    <div class="swatches" style="--cols:${Math.min(size,4)}">${colors.map(hex => `<button class="swatch" data-hex="${hex}" title="複製 ${hex}" aria-label="複製 ${hex}"><i style="background:${hex}"></i><code>${hex}</code></button>`).join('')}</div>
    <footer><select aria-label="${p.name}的顏色數量">${Array.from({length:7}, (_, index) => index+2).map(total => `<option value="${total}" ${total === size ? 'selected' : ''}>${total} 色</option>`).join('')}</select><div class="actions"><button data-select aria-pressed="${active}">${active ? '已選用' : '＋ 選用'}</button><button data-copy title="複製整組色碼">複製整組</button></div></footer>
  <div class="card-tools"><button data-preview aria-label="預覽${p.name}的套色">套色預覽</button><button class="ai-copy" data-copy-ai aria-label="複製${p.name}的 AI 配色指令">複製 AI 配色指令</button></div>
  </article>`;
}
function render() {
  const query = search.value.trim().toUpperCase();
  const matches = palettes.filter(p => (category === '全部' || category === p.category) &&
    [p.name,p.category,p.tags,...p.colors].some(value => value.toUpperCase().includes(query)));
  grid.innerHTML = matches.map(card).join('') || '<p class="empty">找不到符合的色組，試試其他名稱或色碼。</p>';
  byId('results').textContent = `顯示 ${matches.length}／${palettes.length} 組`;
  updateTray();
}
function updateTray() {
  const colors = [...selected].flatMap(cardColors);
  byId('chosen-count').textContent = `已選配色 · ${selected.size} 組／${colors.length} 色`;
  byId('chosen-colors').innerHTML = colors.map(hex => `<i style="background:${hex}" title="${hex}"></i>`).join('');
  byId('chosen-hint').hidden = colors.length > 0;
  for (const id of ['clear', 'copy-selected', 'copy-ai-selected']) {
    byId(id).disabled = colors.length === 0;
  }
}
function copy(colors, label) {
  return copyText(colors.join(', '), `已複製 ${label} · ${colors.length} 色`);
}
const aiUses = {
  web: '網頁或 HTML。請指定頁面背景、卡片底色、標題、正文、次要文字、按鈕底色與按鈕文字，以及必要的邊框，最後附上可貼入 CSS 的 :root 變數。',
  slides: '簡報與教室投影。請指定投影片底色、標題、內文、重點區塊底色與區塊文字。投影片資訊要讓後排容易辨識，正文對比盡量達 7:1。',
  document: '文件或 A4 學習單。請指定頁面底色、標題、正文、表格表頭、格線及書寫區。書寫區用白底，並讓黑白影印後仍能透過粗體、框線及留白辨識區塊。',
  chart: '圖表或活動分組。請保留分類名稱和可辨識的文字或圖樣。漸進資料按數值排列，發散資料標出中點，分類資料用標籤區別。'
};
const purposeLabels = {web:'網頁', slides:'教室投影', document:'A4 學習單', chart:'圖表／分組'};
let previewId;

function luminance(hex) {
  const linear = [1, 3, 5].map(index => {
    const channel = parseInt(hex.slice(index, index + 2), 16) / 255;
    return channel <= 0.04045 ? channel / 12.92 : ((channel + 0.055) / 1.055) ** 2.4;
  });
  return linear[0] * 0.2126 + linear[1] * 0.7152 + linear[2] * 0.0722;
}
function contrast(a, b) {
  const first = luminance(a) + 0.05;
  const second = luminance(b) + 0.05;
  return Math.max(first, second) / Math.min(first, second);
}
function scheme(id, purpose) {
  const colors = cardColors(id);
  const sorted = [...colors].sort((a, b) => luminance(b) - luminance(a));
  const target = purpose === 'slides' ? 7 : 4.5;
  const white = '#FFFFFF';
  const black = '#000000';
  const suggested = new Set();
  const role = (name, bg) => {
    const fg = [...sorted].reverse().find(hex => contrast(hex, bg) >= target)
      || [black, white].sort((a,b) => contrast(b,bg) - contrast(a,bg))[0];
    let background = bg;
    if (contrast(fg, background) < target) {
      background = fg === black ? '#F5F5F5' : '#222222';
      suggested.add(background);
    }
    if (!colors.includes(fg)) suggested.add(fg);
    if (!colors.includes(background)) suggested.add(background);
    return {name, bg:background, fg, ratio:contrast(fg,background)};
  };
  const backdrop = purpose === 'document' || luminance(sorted[0]) < 0.5 ? white : sorted[0];
  const page = role({web:'頁面背景／標題',slides:'投影片背景／標題',document:'紙面／正文',chart:'圖表背景／標題'}[purpose], backdrop);
  const panel = role({web:'資訊卡底色／正文',slides:'說明區底色／內文',document:'表頭底色／文字',chart:'圖例底色／文字'}[purpose], sorted.find(hex => hex !== page.bg) || sorted[0]);
  const focus = role(purpose === 'web' ? '按鈕底色／標籤' : '重點底色／文字', sorted.at(-1));
  const groups = purpose === 'chart' ? colors.slice(0, 4).map((hex, index) => role('第 ' + (index + 1) + ' 組', hex)) : [];
  const rows = purpose === 'chart' ? [page, ...groups] : [page, panel, focus];
  const edge = [...colors, '#333333', black, white].find(hex => rows.every(row => contrast(hex, row.bg) >= 3));
  if (edge && !colors.includes(edge)) suggested.add(edge);
  const used = new Set(rows.flatMap(row => [row.bg, row.fg]));
  if (edge) used.add(edge);
  return {page,panel,focus,groups,rows,edge,target,supplements:[...suggested].filter(hex => used.has(hex))};
}
function describeScheme(id, purpose) {
  const result = scheme(id, purpose);
  return [
    `「${palettes[id].name}」`,
    ...result.rows.map(({name,bg,fg,ratio}) => `- ${name}：底色 ${bg}、文字 ${fg}（${ratio.toFixed(2)}:1）`),
    result.edge ? `- 區隔框線 ${result.edge}` : '- 用留白及文字標籤區隔，視相鄰背景分別設定框線。',
    result.supplements.length ? `- 補色：${result.supplements.join('、')}（僅用於上方指定角色）` : ''
  ].filter(Boolean).join('\n');
}
function aiPrompt(ids) {
  const purpose = byId('ai-purpose').value;
  const colorList = ids.map(id => `- ${palettes[id].name}（${cardColors(id).length} 色）　${cardColors(id).join(', ')}`).join('\n');
  return [
    `請幫我為以下用途配色。${aiUses[purpose]}`,
    `候選色票（優先使用）\n${colorList}`,
    `請依照以下已實算的預覽方案套用色彩角色；如需因版面更換配色，請標明變更原因及新對比值。\n${ids.map(id => describeScheme(id,purpose)).join('\n\n')}`,
    '用 WCAG 對比公式核算實際相鄰的文字與底色。一般文字、表格小字及按鈕標籤至少 4.5:1，符合 WCAG 大字定義的標題至少 3:1。若兩塊底色接近，請用清楚的邊框、留白或標題分區。',
    '請用繁體中文表格列出用途、HEX 色碼、相鄰背景 HEX 和文字對比值。'
  ].join('\n\n');
}
function updatePreview() {
  const purpose = byId('ai-purpose').value;
  const {page,panel,focus,groups,rows,edge,target,supplements} = scheme(previewId,purpose);
  byId('preview-title').textContent = `${palettes[previewId].name} · 套色預覽`;
  byId('preview-status').textContent = '';
  byId('preview-modes').innerHTML = Object.entries(purposeLabels).map(([key,label]) =>
    `<button type="button" data-purpose="${key}" aria-pressed="${purpose === key}">${label}</button>`).join('');
  const examples = {
    web:'<h3>班級學習活動</h3><div class="sample-block">今天的任務 · 記下你最有印象的一個發現。</div><span class="sample-focus">開始練習</span>',
    slides:'<h3>換個角度想一想</h3><div class="sample-block">先找出事實，再說說你的觀點。</div><span class="sample-focus">兩人討論 · 30 秒</span>',
    document:'<h3>我的觀察筆記</h3><div class="sample-block">題目 · 寫下一件你觀察到的事。</div><div class="sample-lines" aria-label="白底書寫區"><div></div><div></div></div><span class="sample-focus">提示 · 可以從時間或地點寫起。</span>',
    chart:`<h3>活動分組</h3><div class="sample-chart">${groups.map((row,index) => `<div class="sample-bar" style="width:${42 + index * 16}%;background:${row.bg};color:${row.fg}">${row.name}</div>`).join('')}</div>`
  };
  const swatch = hex => `<i class="role-chip" style="background:${hex}" aria-hidden="true"></i><code>${hex}</code>`;
  byId('preview-content').innerHTML = `
    <div class="sample" style="--sample-page:${page.bg};--sample-text:${page.fg};--block-bg:${panel.bg};--block-fg:${panel.fg};--focus-bg:${focus.bg};--focus-fg:${focus.fg};--sample-edge:${edge || page.fg}">${examples[purpose]}</div>
    <table class="roles"><thead><tr><th>用途</th><th>底色</th><th>文字</th><th>對比值</th></tr></thead><tbody>
    ${rows.map(row => `<tr><th scope="row">${row.name}</th><td>${swatch(row.bg)}</td><td>${swatch(row.fg)}</td><td>${row.ratio.toFixed(2)}:1</td></tr>`).join('')}
    </tbody></table>
    <p class="note muted">文字目標 ${target}:1 · ${edge ? '區隔框線 ' + edge : '以留白及標籤區隔'}</p>
    ${supplements.length ? `<p class="note muted">預覽補色 ${supplements.join('、')}，用於提高文字對比或區隔底色。</p>` : ''}`;
}
async function copyText(value, message) {
  const previousFocus = document.activeElement;
  let copied = false;
  try {
    await navigator.clipboard.writeText(value);
    copied = true;
  } catch {
    const field = document.createElement('textarea');
    field.value = value;
    field.style.cssText = 'position:fixed;left:0;top:0;opacity:0;pointer-events:none';
    document.body.append(field);
    field.select();
    try { copied = document.execCommand('copy'); } catch {}
    field.remove();
    previousFocus?.focus();
  }
  if (!copied) {
    const field = byId('manual-text');
    field.value = value;
    byId('manual').showModal();
    field.select();
    return;
  }
  byId('preview-status').textContent = byId('preview-dialog').open ? message : '';
  byId('toast').textContent = message;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { byId('toast').textContent = ''; }, 2400);
}
tabs.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  category = button.dataset.category;
  for (const tab of tabs.children) tab.setAttribute('aria-pressed', tab === button);
  render();
});
search.addEventListener('input', render);
grid.addEventListener('change', event => {
  const select = event.target.closest('select');
  if (!select) return;
  const article = select.closest('article');
  const id = Number(article.dataset.id);
  counts.set(id, Number(select.value));
  article.outerHTML = card(palettes[id]);
  grid.querySelector(`[data-id="${id}"] select`).focus({preventScroll:true});
  updateTray();
});
grid.addEventListener('click', event => {
  const button = event.target.closest('button');
  if (!button) return;
  const article = button.closest('article');
  const id = Number(article.dataset.id);
  if (button.hasAttribute('data-select')) {
    if (selected.has(id)) selected.delete(id);
    else selected.add(id);
    article.classList.toggle('selected', selected.has(id));
    button.setAttribute('aria-pressed', selected.has(id));
    button.textContent = selected.has(id) ? '已選用' : '＋ 選用';
    updateTray();
  } else if (button.hasAttribute('data-preview')) {
    previewId = id;
    updatePreview();
    byId('preview-dialog').showModal();
  } else if (button.hasAttribute('data-copy-ai')) {
    copyText(aiPrompt([id]), '已複製 AI 配色指令');
  } else if (button.hasAttribute('data-copy')) {
    copy(cardColors(id), palettes[id].name);
  } else {
    copy([button.dataset.hex], button.dataset.hex);
  }
});
byId('clear').addEventListener('click', () => { selected.clear(); render(); });
byId('copy-selected').addEventListener('click', () => copy([...selected].flatMap(cardColors), '已選色碼'));
byId('copy-ai-selected').addEventListener('click', () => copyText(aiPrompt([...selected]), '已複製已選色組的 AI 配色指令'));
byId('preview-modes').addEventListener('click', event => {
  const button = event.target.closest('[data-purpose]');
  if (!button) return;
  byId('ai-purpose').value = button.dataset.purpose;
  updatePreview();
  byId('preview-modes').querySelector('[aria-pressed=true]').focus();
});
byId('copy-preview').addEventListener('click', () => copyText(aiPrompt([previewId]), '已複製此方案的 AI 指令'));
byId('source-link').addEventListener('click', () => { byId('sources').open = true; });
render();
</script>
</body>
